server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Hashed build assets are content-addressed — cache forever.
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Static media
  location ~* \.(?:jpg|jpeg|png|gif|svg|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  # HTML routes: `trailingSlash: true` emits a directory with index.html per
  # route, so $uri/ resolves directly; no SPA fallback is needed.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ $uri.html =404;
  }
}